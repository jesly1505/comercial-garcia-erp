version: '3.8'

services:
  # ==========================================
  # BASE DE DATOS: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-comercial_garcia_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-comercial_garcia_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # SERVICIO BACKEND: Node.js / Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-comercial_garcia_erp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-erp_super_secret_jwt_key_2026_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-erp_super_secret_refresh_jwt_key_2026_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads

  # ==========================================
  # SERVICIO FRONTEND: React / Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    name: erp_postgres_data
  backend_uploads:
    name: erp_backend_uploads
